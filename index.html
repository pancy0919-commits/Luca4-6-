<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小卡漫劇場 第 6 集：紫霧大反擊</title>
    <style>
        body {
            background-color: #08030f;
            color: #ffffff;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h2 {
            color: #d154ff;
            margin-bottom: 8px;
            font-size: 22px;
        }

        /* 舒適的標準舞臺大小 (850px x 480px) */
        .stage {
            width: 850px;
            height: 480px;
            background: linear-gradient(135deg, #1f0a33, #4a154b);
            border: 4px solid #d154ff;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(209, 84, 255, 0.4);
            transition: transform 0.3s ease;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background-color: #0d0317;
            border-top: 4px solid #d154ff;
        }

        /* 角色圖層 */
        .actor {
            position: absolute;
            bottom: 110px;
            font-size: 65px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
        }

        .actor-pipi { left: 100px; }
        .actor-monster { left: 180px; }
        .actor-enemy { right: 100px; transform: scaleX(-1); opacity: 0; }

        /* 特效元件 */
        .dark-beam {
            position: absolute;
            bottom: 140px;
            right: 170px;
            width: 0px;
            height: 45px;
            background: linear-gradient(90deg, #ff0055, #d154ff, #ffffff);
            box-shadow: 0 0 25px #ff0055, 0 0 40px #d154ff;
            border-radius: 20px;
            opacity: 0;
            transition: width 0.3s ease-out, opacity 0.2s ease;
            z-index: 6;
        }

        .cookie-shield {
            position: absolute;
            bottom: 110px;
            left: 240px;
            font-size: 70px;
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 7;
        }

        /* 漫畫風格對話框 */
        .speech-bubble {
            position: absolute;
            background: #ffffff;
            color: #000000;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4), 0 0 0 2px #000;
            max-width: 260px;
            display: none;
            z-index: 10;
        }

        .bubble-pipi { bottom: 190px; left: 80px; }
        .bubble-monster { bottom: 190px; left: 160px; }
        .bubble-enemy { bottom: 190px; right: 80px; }

        /* 片尾過場畫面 */
        .ending-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 20;
        }

        .ending-title {
            font-size: 32px;
            color: #00f0ff;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }

        .ending-sub {
            font-size: 18px;
            color: #ffcc00;
        }

        /* 控制面板 */
        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-replay {
            background: linear-gradient(135deg, #d154ff, #8e24aa);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(209, 84, 255, 0.4);
        }

        .btn-replay:hover {
            transform: scale(1.05);
        }

        .status-text {
            color: #00f0ff;
            font-size: 14px;
            font-family: monospace;
        }

        /* 畫面微幅震動 */
        .stage-shake {
            animation: stageShake 0.35s ease-in-out infinite;
        }

        @keyframes stageShake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 4px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-4px, -3px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <h2>小卡漫劇場 第 6 集：故事一（下）紫霧大反擊</h2>

    <div id="stage" class="stage">
        <div class="ground"></div>
        
        <!-- 敵數大將 -->
        <div id="enemy" class="actor actor-enemy">👾🏴‍☠️</div>

        <!-- 角色區：皮皮與小怪獸 -->
        <div id="pipi" class="actor actor-pipi">👦</div>
        <div id="monster" class="actor actor-monster">👾</div>

        <!-- 攻擊特效 -->
        <div id="darkBeam" class="dark-beam"></div>
        <div id="cookieShield" class="cookie-shield">🍪</div>
        
        <!-- 漫畫對話框 -->
        <div id="bubblePipi" class="speech-bubble bubble-pipi"></div>
        <div id="bubbleMonster" class="speech-bubble bubble-monster"></div>
        <div id="bubbleEnemy" class="speech-bubble bubble-enemy"></div>

        <!-- 片尾畫面 -->
        <div id="endingScreen" class="ending-overlay">
            <div class="ending-title">🌟 第 6 集 完結 🌟</div>
            <div class="ending-sub">第一故事圓滿過關！準備前往第二故事尋找第一片掉落碎片！</div>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn-replay" onclick="playAnimation()">🔁 重新播放動畫</button>
        <span id="statusText" class="status-text">動畫播放中...</span>
    </div>

<script>
    const stage = document.getElementById('stage');
    const pipi = document.getElementById('pipi');
    const monster = document.getElementById('monster');
    const enemy = document.getElementById('enemy');
    const darkBeam = document.getElementById('darkBeam');
    const cookieShield = document.getElementById('cookieShield');
    
    const bubblePipi = document.getElementById('bubblePipi');
    const bubbleMonster = document.getElementById('bubbleMonster');
    const bubbleEnemy = document.getElementById('bubbleEnemy');
    const endingScreen = document.getElementById('endingScreen');
    const statusText = document.getElementById('statusText');

    let timers = [];

    function hideAllBubbles() {
        bubblePipi.style.display = 'none';
        bubbleMonster.style.display = 'none';
        bubbleEnemy.style.display = 'none';
    }

    function playAnimation() {
        // 清除舊計時器並重置畫面
        timers.forEach(t => clearTimeout(t));
        timers = [];
        
        endingScreen.style.opacity = '0';
        stage.classList.remove('stage-shake');
        stage.style.boxShadow = '0 10px 30px rgba(209, 84, 255, 0.4)';
        
        pipi.innerText = '👦';
        pipi.style.transform = 'translateX(0)';
        monster.style.transform = 'translateX(0)';
        enemy.style.opacity = '1';
        enemy.style.transform = 'scaleX(-1) translateX(0)';

        darkBeam.style.width = '0px';
        darkBeam.style.opacity = '0';
        cookieShield.style.opacity = '0';
        cookieShield.style.transform = 'scale(0.3)';
        hideAllBubbles();
        statusText.innerText = 'STATUS: 播放中...';

        // 1. 敵數大將現身發下狠話 (1.0s)
        timers.push(setTimeout(() => {
            hideAllBubbles();
            bubbleEnemy.style.display = 'block';
            bubbleEnemy.innerText = "哼！想贏我？沒那麼容易！看招！";
            statusText.innerText = 'STATUS: 分鏡 1 - 敵數攻擊';
        }, 1000));

        // 2. 發射暗黑衝擊波，舞臺震動！(4.0s)
        timers.push(setTimeout(() => {
            hideAllBubbles();
            darkBeam.style.opacity = '1';
            darkBeam.style.width = '420px';
            stage.classList.add('stage-shake');
        }, 4000));

        // 3. 皮皮害怕變難過臉 (😢) (5.0s)
        timers.push(setTimeout(() => {
            pipi.innerText = '😢';
            bubblePipi.style.display = 'block';
            bubblePipi.innerText = "哇啊！攻擊好強，我們快被打飛了……！";
        }, 5000));

        // 4. 小怪獸表情不變 (👾)，挺身張開「餅乾防護罩」！(8.0s)
        timers.push(setTimeout(() => {
            hideAllBubbles();
            monster.style.transform = 'translateX(60px)';
            cookieShield.style.opacity = '1';
            cookieShield.style.transform = 'scale(1.3)';
            bubbleMonster.style.display = 'block';
            bubbleMonster.innerText = "吼嚕嚕！皮皮別怕！餅乾防禦罩──反彈！";
            statusText.innerText = 'STATUS: 分鏡 2 - 餅乾防護罩反擊';
        }, 8000));

        // 5. 敵數大將被彈飛 (11.0s)
        timers.push(setTimeout(() => {
            darkBeam.style.width = '0px';
            darkBeam.style.opacity = '0';
            stage.classList.remove('stage-shake');

            enemy.style.transform = 'scaleX(-1) translateX(180px) rotate(45deg)';
            enemy.style.opacity = '0';
        }, 11000));

        // 6. 勝利對話：皮皮恢復笑容，小怪獸想著餅乾 (13.5s)
        timers.push(setTimeout(() => {
            cookieShield.style.opacity = '0';
            pipi.innerText = '😄';
            bubblePipi.style.display = 'block';
            bubblePipi.innerText = "太棒了！我們成功擊退敵數大將了！";
            statusText.innerText = 'STATUS: 分鏡 3 - 勝利與對話';
        }, 13500));

        // 7. 小怪獸招牌發言 (16.5s)
        timers.push(setTimeout(() => {
            hideAllBubbles();
            bubbleMonster.style.display = 'block';
            bubbleMonster.innerText = "吼嚕嚕……打贏了，但是壞人身上怎麼沒有餅乾呢？";
        }, 16500));

        // 8. 準備前往第二個故事 (20.0s)
        timers.push(setTimeout(() => {
            hideAllBubbles();
            bubblePipi.style.display = 'block';
            bubblePipi.innerText = "走吧！我們去下一個故事，尋找第一片掉落的碎片！";
        }, 20000));

        // 9. 片尾過場 (24.0s)
        timers.push(setTimeout(() => {
            hideAllBubbles();
            stage.style.boxShadow = '0 0 40px #00f0ff';
            endingScreen.style.opacity = '1';
            statusText.innerText = 'STATUS: 第 6 集 播放完畢';
        }, 24000));
    }

    // 頁面載入自動播放
    window.onload = playAnimation;
</script>
</body>
</html>
